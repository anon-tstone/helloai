<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 3D Filter - Face Filters</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎭 AR 3D Face Filter</h1>

        <!-- Camera and Canvas -->
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">
            <h2>เลือก Filter:</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="none">ไม่มี Filter</button>
                <button class="filter-btn" data-filter="glasses">แว่นตา</button>
                <button class="filter-btn" data-filter="mask">หน้ากาก</button>
                <button class="filter-btn" data-filter="bunny">หูกระต่าย</button>
                <button class="filter-btn" data-filter="crown">👑 มงกุฎ</button>
            </div>
        </div>

        <!-- Status -->
        <div id="status" class="status">กำลังโหลด...</div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

    <!-- Main App -->
    <script src="app.js"></script>
</body>
</html>
