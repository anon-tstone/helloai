name: Deploy Flipbook Studio

# Runs on pushes to the feature branch, and can be dispatched by hand once this
# file reaches the default branch (GitHub only offers workflow_dispatch there).
#
# Deploying needs a CLOUDFLARE_API_TOKEN repository secret. Without it the job
# still succeeds and simply reports that it skipped, so an unconfigured repo
# does not sit on a red run.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/flipbook-web-system-cclsu6
    paths:
      - 'flipbook/**'
      - '.github/workflows/deploy-flipbook.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flipbook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flipbook/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Check for deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set - build verified, deploy skipped."
          fi

      - name: Publish Worker and static assets
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional: only needed when the token can reach more than one account.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: flipbook
          command: deploy
